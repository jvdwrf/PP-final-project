name:                fml
version:             1.0
license:             MIT
author:              "Paul Blum & Jasper van der Werf"
maintainer:          "unmaintained@unmaintained"
copyright:           "2022 Paul Blum & Jasper van der Werf"

extra-source-files:
- README.md

description:         Implementation of FML.

dependencies:
- base >= 4.7 && < 5
- parsec >= 3.1 && < 3.2
- sprockell >= 2022.0
- hspec >= 2.8 && < 2.9
- QuickCheck >= 2.14 && < 2.15
- containers
- ghc

library:
  source-dirs: src

executables:
  my-lang-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fml

tests:
  my-lang-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - fml
